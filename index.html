<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product preview card component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        
 <picture>
    <source
        media="(min-width: 35rem)"
        srcset="images/image-product-desktop.jpg">

    <img
        src="images/image-product-mobile.jpg"
        alt="Gabrielle Essence Eau De Parfum bottle">
</picture>

      <div class="content">
        <p class="category">Perfume</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p class="description">
            A floral, solar and voluptuous interpretation composed by
            Olivier Polge, Perfumer-Creator for the House of CHANEL.
        </p>

      <div class="price">
       <span class="current-price">$149.99</span>
       <span class="old-price"><s>$169.99</s></span>
 </div>

      <button type="button">
        <img src="images/icon-cart.svg" alt="">
        Add to Cart
      </button>
      </div>
    </main>
</body>
</html>
